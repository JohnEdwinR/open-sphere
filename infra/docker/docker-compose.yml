name: open-sphere-dev

# Local development infrastructure only (see 03_SOFTWARE_ARCHITECTURE/Architecture.md §8).
# Not consumed by apps/backend yet — the Phase 1 simulation engine is headless/in-memory.
# Wired up starting Phase 3 (Backend & Persistence), see 01_PRODUCT/Roadmap.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: open_sphere
      POSTGRES_PASSWORD: open_sphere_dev
      POSTGRES_DB: open_sphere
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: open_sphere
      MINIO_ROOT_PASSWORD: open_sphere_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data:
