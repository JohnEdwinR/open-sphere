name: open-sphere-dev

# Local development infrastructure only (see 03_SOFTWARE_ARCHITECTURE/Architecture.md §8).
# Postgres is used by apps/backend/prisma (see apps/backend/README.md); Redis
# is not wired into the app yet (WorldGateway still broadcasts in-process).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: open_sphere
      POSTGRES_PASSWORD: open_sphere_dev
      POSTGRES_DB: open_sphere
    ports:
      # Host port 5433, not 5432: this machine already runs a native
      # Windows PostgreSQL service on 5432, which silently wins connections
      # from the host to "localhost:5432" over the container. Only the
      # host-side mapping changes — Postgres still listens on 5432 inside
      # the container/Docker network.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: open_sphere
      MINIO_ROOT_PASSWORD: open_sphere_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data:
