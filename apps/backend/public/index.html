<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Open Sphere — World Viewer (Phase 2 fishbowl client)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0f14;
        color: #e6edf3;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      #hud {
        position: fixed;
        top: 10px;
        left: 10px;
        font-size: 13px;
        line-height: 1.5;
        background: rgba(13, 17, 23, 0.72);
        padding: 10px 14px;
        border-radius: 8px;
        pointer-events: none;
        white-space: pre;
      }
      #hud .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
      canvas { display: block; cursor: grab; }
      canvas:active { cursor: grabbing; }
    </style>
  </head>
  <body>
    <div id="hud">connecting…</div>
    <canvas id="world"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      // No-auth, no-persistence "fishbowl" viewer (Roadmap Phase 2). Renders
      // whatever the server broadcasts; it never computes gameplay state
      // itself — purely a window into server-authoritative reality, same
      // principle the real mobile client will follow (Architecture §6).
      const canvas = document.getElementById("world");
      const ctx = canvas.getContext("2d");
      const hud = document.getElementById("hud");

      /** @type {Map<string, {id:string, kind:string, x:number, y:number, heading?:number, hunger?:number, growthStage?:number, nutrition?:number}>} */
      const entities = new Map();
      let latestTick = 0;
      let chunkId = 0;

      const camera = { x: 30, y: 30, scale: 10 };
      let isDragging = false;
      let lastMouse = { x: 0, y: 0 };

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resize);
      resize();

      function worldToScreen(x, y) {
        return {
          x: (x - camera.x) * camera.scale + canvas.width / 2,
          y: (y - camera.y) * camera.scale + canvas.height / 2,
        };
      }

      canvas.addEventListener("mousedown", (e) => {
        isDragging = true;
        lastMouse = { x: e.clientX, y: e.clientY };
      });
      window.addEventListener("mouseup", () => (isDragging = false));
      window.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        camera.x -= (e.clientX - lastMouse.x) / camera.scale;
        camera.y -= (e.clientY - lastMouse.y) / camera.scale;
        lastMouse = { x: e.clientX, y: e.clientY };
      });
      canvas.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
          camera.scale = Math.min(60, Math.max(2, camera.scale * factor));
        },
        { passive: false },
      );

      function hungerColor(hunger) {
        // green (well fed) -> yellow -> red (starving)
        const h = Math.max(0, Math.min(1, hunger ?? 0));
        const r = Math.round(60 + h * 195);
        const g = Math.round(200 - h * 150);
        return `rgb(${r}, ${g}, 70)`;
      }

      function render() {
        ctx.fillStyle = "#0b0f14";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // world-bounds reference grid (every 10 world units)
        ctx.strokeStyle = "rgba(255,255,255,0.06)";
        ctx.lineWidth = 1;
        for (let gx = 0; gx <= 60; gx += 10) {
          const a = worldToScreen(gx, 0);
          const b = worldToScreen(gx, 60);
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
        for (let gy = 0; gy <= 60; gy += 10) {
          const a = worldToScreen(0, gy);
          const b = worldToScreen(60, gy);
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }

        let snakeCount = 0;
        let foodCount = 0;

        for (const entity of entities.values()) {
          const { x, y } = worldToScreen(entity.x, entity.y);

          if (entity.kind === "food") {
            foodCount += 1;
            ctx.fillStyle = "#4fd67a";
            ctx.beginPath();
            ctx.arc(x, y, Math.max(2, camera.scale * 0.12), 0, Math.PI * 2);
            ctx.fill();
            continue;
          }

          snakeCount += 1;
          const radius = (4 + (entity.growthStage ?? 0) * 1.5) * (camera.scale / 10);
          ctx.fillStyle = hungerColor(entity.hunger);
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();

          // heading indicator
          if (typeof entity.heading === "number") {
            ctx.strokeStyle = "rgba(255,255,255,0.6)";
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + Math.cos(entity.heading) * radius * 1.6, y + Math.sin(entity.heading) * radius * 1.6);
            ctx.stroke();
          }
        }

        hud.textContent = `Open Sphere — World Viewer\nchunk ${chunkId}  tick ${latestTick}\nsnakes ${snakeCount}   food ${foodCount}\ndrag to pan · scroll to zoom`;

        requestAnimationFrame(render);
      }

      const socket = io();

      socket.on("connect", () => {
        hud.textContent = "connected, waiting for snapshot…";
      });

      socket.on("disconnect", () => {
        hud.textContent = "disconnected — is the server still running?";
      });

      socket.on("chunk:snapshot", (snapshot) => {
        entities.clear();
        for (const entity of snapshot.entities) entities.set(entity.id, entity);
        latestTick = snapshot.tick;
        chunkId = snapshot.chunkId;
      });

      socket.on("chunk:delta", (delta) => {
        for (const entity of delta.added) entities.set(entity.id, entity);
        for (const entity of delta.updated) entities.set(entity.id, entity);
        for (const id of delta.removed) entities.delete(id);
        latestTick = delta.tick;
        chunkId = delta.chunkId;
      });

      requestAnimationFrame(render);
    </script>
  </body>
</html>
